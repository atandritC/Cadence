<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Cadence — Project Management REST API</title>
  <desc id="desc">A dark navy banner with a clean workflow line connecting project, task, and delivery milestones.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="20" x2="1520" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1725"/>
      <stop offset=".58" stop-color="#142A40"/>
      <stop offset="1" stop-color="#1D3E5A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 260 -420 0 1360 120)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D8AB8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3D8AB8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#D9E8F2" fill-opacity=".09"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020810" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="30" fill="url(#glow)"/>
  <rect width="1600" height="520" rx="30" fill="url(#dots)"/>
  <path d="M0 442c240-54 411 25 648 15 298-13 511-87 952-44v107H0V442Z" fill="#050D16" fill-opacity=".25"/>
