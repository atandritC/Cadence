  <text x="98" y="241" fill="#F3F7FA" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-2.6">Cadence</text>
  <text x="104" y="299" fill="#C9D8E3" font-family="Georgia,Times New Roman,serif" font-size="32">Project Management REST API</text>
  <path d="M104 338h62" stroke="#5AA8D2" stroke-width="4" stroke-linecap="round"/>
  <text x="104" y="382" fill="#CDD9E2" font-family="Segoe UI,Arial,sans-serif" font-size="19">A secure backend for teams to plan work and move it forward.</text>
  <text x="104" y="474" fill="#91AFC4" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="1.6">JAVA 21  ·  SPRING BOOT  ·  POSTGRESQL  ·  JWT</text>
  <g filter="url(#shadow)" transform="translate(892 139)">
